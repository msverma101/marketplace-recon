id = "s03-logging-regression"
version = 1
kind = "simulated"
description = "40% of order_created events are dropped by the web logging pipeline for 2 days. Real orders continue."

[world]
start = "2018-03-01"
days = 21
scale = 0.5
seed = 13

[[interventions]]
id = "iv-logdrop"
layer = "observation"
target = "logging.drop_rate"
operator = "set"
value = 0.4
selector = "event_type == 'order_created' and stream == 'web'"
window = ["2018-03-14T00:00", "2018-03-16T00:00"]

[[truth]]
kind = "cause"
target = "measurement:logging_drop"
segment = "all"
window = ["2018-03-14T00:00", "2018-03-16T00:00"]
identifiable = true
symptoms = [["order_created", "all"]]
max_lag_h = 3
notes = "World is unchanged (zero factual-twin effect). payment_approved (payments stream) still shows full volume: reconciliation separates logging failure from a demand drop."
